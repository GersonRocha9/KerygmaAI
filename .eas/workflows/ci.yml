name: CI - TypeScript, Lint and Tests

on:
  pull_request:
    branches: ["*"]

jobs:
  ci:
    name: CI jobs
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules

      - name: Run TypeScript Compiler
        run: npx tsc --noEmit

      - name: Run Lint
        run: npm run lint

      - name: Run Tests
        run: npm run test
